<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="반음마다 30°씩 도는 붐웨커 색 3D 나선 계단. 계단을 누르거나 클래식 곡을 재생하면 음이 빛나요.">
<script>
/* 카카오톡·네이버·페이스북·인스타그램 등 인앱 브라우저에서 열리면 기본 브라우저로 다시 열기 */
(function () {
  var ua = navigator.userAgent || '';
  var url = location.href;
  var inApp = /KAKAOTALK|NAVER\(inapp|FBAN|FBAV|FB_IAB|Instagram|Line\/|DaumApps|everytimeApp|SamsungBrowser\/[^ ]+ \(.*inapp|wv\)/i.test(ua);
  if (/KAKAOTALK/i.test(ua)) {
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
    return;
  }
  if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
    location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
    return;
  }
  if (!inApp) return;
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
    return;
  }
  // iOS 인앱 브라우저는 사파리로 강제로 넘길 수 없어서 안내를 띄웁니다
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(13,17,32,.94);color:#eef0f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 system-ui,sans-serif';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 소리와 3D가 제대로 작동하지 않을 수 있어요.<br>오른쪽 아래(또는 위)의 ⋯ 메뉴에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button id="copyUrl" style="font:inherit;padding:10px 18px;border-radius:999px;border:0;background:#eef0f8;color:#0d1120">주소 복사</button>' +
      '<button id="stayHere" style="font:inherit;background:none;border:0;color:#9aa3c0;text-decoration:underline">그냥 여기서 보기</button>';
    document.body.appendChild(box);
    document.getElementById('copyUrl').onclick = function () {
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
        function () { b.textContent = '복사했어요'; },
        function () { prompt('주소를 복사하세요', url); });
    };
    document.getElementById('stayHere').onclick = function () { box.remove(); };
  });
})();
</script>
<title>계이름 계단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: full-bleed 3D stage, with a quiet title block top-left, a live note readout top-right, and a colour key + controls docked at the bottom. Single dark look by choice, so the 12 note colours glow. */
  :root {
    --bg: #0d1120;
    --bg-2: #161c33;
    --panel: rgba(13, 17, 32, 0.74);
    --fg: #eef0f8;
    --muted: #9aa3c0;
    --line: rgba(220, 228, 255, 0.14);
    --focus: #ffe600;
    --display: "Gowun Batang", "Nanum Myeongjo", serif;
    --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .top {
    position: fixed; left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    padding-inline: 16px;
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px;
    pointer-events: none;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .chord { position: relative; }
  .chord.gone { opacity: 0 !important; transform: translateY(-6px); }
  .chord { transition: opacity .35s, transform .35s; }
  .chord {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 14px 10px 10px; backdrop-filter: blur(8px);
    display: flex; align-items: center; gap: 12px;
    box-sizing: border-box; width: 300px; height: 106px; overflow: hidden; flex: none;
    transition: opacity .3s;
  }
  .chord.idle { opacity: .55; }
  .chord svg { flex: none; }
  .chord-text { min-width: 0; flex: 1; }
  .chord-row { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .chord-rn { font: 700 20px/1 var(--display); color: var(--fg); white-space: nowrap; }
  .chord-rn.tonic { color: #7ee0a1; } .chord-rn.dom { color: #ffb36b; } .chord-rn.sub { color: #8fc7ff; } .chord-rn.sec { color: #e8a3ff; }
  .chord-sym { font: 700 32px/1 var(--display); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chord-desc { font-size: 12px; color: var(--muted); margin-top: 6px; word-break: keep-all; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .readout {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 16px; backdrop-filter: blur(8px);
    display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 14px; align-items: center;
    box-sizing: border-box; width: 340px; height: 106px; overflow: hidden; flex: none;
  }
  .swatch { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-2); box-shadow: 0 0 0 1px var(--line); transition: background .2s, box-shadow .2s; }
  .solfa { font-family: var(--display); font-size: 28px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* if the option bar has to wrap, it breaks between the two groups: scales on line 1, switches on line 2 */
  .options { flex-wrap: wrap; justify-content: center; row-gap: 2px; }
  .opt-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .foldable { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 100%; }
  .bottom.folded .foldable, .bottom.folded .hint { display: none; }
  .fold {
    pointer-events: auto; font: 500 12px/1 var(--body); color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    height: 28px; padding: 0 14px; cursor: pointer; backdrop-filter: blur(8px);
  }
  .fold:hover { color: var(--fg); }
  .fold:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .bottom {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-inline: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: none;
  }
  .keys, .controls { pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 100%; }
  .key {
    font: 500 13px/1 var(--body); color: #10131f;
    background: var(--c); border: 0; border-radius: 999px;
    min-width: 44px; height: 34px; padding: 0 10px; cursor: pointer;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
    transition: transform .12s;
  }
  .key.light-text { color: #fff; }
  .key:hover { transform: translateY(-2px); }
  .controls { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px; backdrop-filter: blur(8px); }
  .btn {
    font: 500 13px/1 var(--body); color: var(--fg); background: transparent;
    border: 0; border-radius: 999px; height: 34px; padding: 0 14px; cursor: pointer;
  }
  .btn:hover { background: var(--bg-2); }
  .btn.primary { background: var(--fg); color: var(--bg); }
  .btn[aria-pressed="false"] { color: var(--muted); }
  .btn[aria-pressed="true"]::before { content: "● "; font-size: 9px; vertical-align: 2px; }
  .key:focus-visible, .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .hint { font-size: 11px; color: var(--muted); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:disabled:hover { background: transparent; }
  .songs { align-items: center; }
  #songSel, #instSel {
    font: 500 13px/1 var(--body); color: var(--fg); background: var(--bg-2);
    border: 1px solid var(--line); border-radius: 999px; height: 34px; padding: 0 12px; max-width: 100%;
  }
  #songSel:focus-visible, #instSel:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .readout > div:last-child { min-width: 0; }
  .meta { word-break: keep-all; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vkey { display: flex; flex-wrap: nowrap; gap: 4px 10px; margin-top: 6px; font-size: 11px; color: var(--muted); overflow: hidden; white-space: nowrap; }
  .vk { flex: none; }
  .credit-line { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 4px); font-size: 10px; color: var(--muted); opacity: .75; pointer-events: none; }
  .vk { display: inline-flex; align-items: center; gap: 5px; }
  #seek { width: 140px; accent-color: var(--fg); }
  .vk i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px rgba(255,255,255,.5); }
  .tempo { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 10px; font-variant-numeric: tabular-nums; }
  .tempo input { width: 96px; accent-color: var(--fg); }
  .tempo output { min-width: 3.2em; color: var(--fg); }

  @media (max-width: 640px) {
    .top { gap: 8px; flex-wrap: nowrap; }
    .readout { width: calc(50vw - 20px); height: 88px; padding: 8px 10px; grid-template-columns: 30px minmax(0, 1fr); column-gap: 8px; }
    .chord { width: calc(50vw - 20px); height: 88px; padding: 6px 8px 6px 6px; gap: 6px; }
    .chord svg { width: 50px; height: 50px; }
    .chord-sym { font-size: 22px; }
    .chord-rn { font-size: 15px; }
    .chord-row { gap: 6px; }
    .chord-desc { font-size: 10.5px; margin-top: 3px; }
    .meta { font-size: 10.5px; }
    .vkey { display: none; }
    .swatch { width: 30px; height: 30px; }
    .solfa { font-size: 22px; }
    .key { min-width: 40px; height: 30px; font-size: 12px; padding: 0 8px; }
    .btn { height: 30px; padding: 0 10px; font-size: 12px; }
    .controls { border-radius: 16px; }
    .hint { display: none; }
    #seek { width: 96px; }
    .tempo input { width: 72px; }
  }

  /* ---------- wide screens (interactive whiteboards, 16:10 and wider): controls in a left rail,
     chord + note info in a right rail, the stair fills the full height in between. Everything is
     sized from the viewport height so nothing ever scrolls. ---------- */
  body.wide { --rail: clamp(250px, 19vw, 380px); --btnH: clamp(34px, 5vh, 58px); --fs: clamp(13px, 1.6vh, 21px); }
  body.wide .btn, body.wide #songSel, body.wide #instSel { height: var(--btnH); font-size: var(--fs); border-radius: 12px; }
  body.wide .bottom {
    left: 16px; right: auto; top: calc(env(safe-area-inset-top, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    width: var(--rail); padding: 0; align-items: stretch; justify-content: flex-start; gap: 1.4vh; overflow: hidden;
  }
  body.wide .fold, body.wide .hint { display: none; }
  /* flatten the foldable wrapper so the colour keys can sit at the very bottom of the rail, within children's reach */
  body.wide .foldable, body.wide .bottom.folded .foldable { display: contents; }
  body.wide .options { order: 1; }
  body.wide .songs { order: 2; }
  body.wide .keys { order: 3; margin-top: auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 1vh; }
  body.wide .key { min-width: 0; width: 100%; height: calc(var(--btnH) * 1.45); font-size: calc(var(--fs) * 1.25);
    font-weight: 700; padding: 0; border-radius: 14px; }
  body.wide .controls { border-radius: 16px; padding: 0.8vh; max-width: none; }
  body.wide .options { display: flex; flex-direction: column; gap: 0.6vh; }
  body.wide .opt-group { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6vh; }
  body.wide .opt-group .btn { padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.wide .songs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8vh; align-items: center; }
  body.wide #songSel, body.wide #instSel, body.wide #seek, body.wide .songs .tempo { grid-column: 1 / -1; width: 100%; box-sizing: border-box; }
  body.wide #seek { height: calc(var(--btnH) * 0.6); margin: 0; }
  body.wide .songs .tempo { padding: 0 4px; font-size: var(--fs); white-space: nowrap; }
  body.wide .songs .tempo input { flex: 1; width: auto; }
  body.wide .credit-line { right: auto; left: 50%; transform: translateX(-50%); font-size: clamp(10px, 1.2vh, 14px); }

  body.wide .top {
    left: auto; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    width: var(--rail); padding: 0; flex-direction: column; flex-wrap: nowrap; justify-content: flex-start; align-items: stretch; gap: 1.6vh;
  }
  body.wide .chord {
    width: 100%; height: 56vh; flex-direction: column; justify-content: center; align-items: center; gap: 1.6vh; padding: 2vh;
  }
  body.wide .chord svg { width: min(100%, 32vh); height: auto; aspect-ratio: 1; }
  body.wide .chord-text { flex: none; width: 100%; text-align: center; }
  body.wide .chord-row { justify-content: center; gap: 1.4vh; }
  body.wide .chord-sym { font-size: 7.5vh; }
  body.wide .chord-rn { font-size: 4.4vh; }
  body.wide .chord-desc { font-size: clamp(13px, 1.9vh, 24px); margin-top: 1.2vh; -webkit-line-clamp: 3; }
  body.wide .readout { width: 100%; height: 20vh; padding: 2vh; grid-template-columns: 8vh minmax(0, 1fr); column-gap: 2vh; }
  body.wide .swatch { width: 8vh; height: 8vh; }
  body.wide .solfa { font-size: 6vh; }
  body.wide .meta { font-size: clamp(12px, 1.6vh, 20px); margin-top: 0.8vh; }
  body.wide .vkey { font-size: clamp(11px, 1.4vh, 18px); margin-top: 1vh; }
  body.wide .vk i { width: 1.2vh; height: 1.2vh; }
  @media (prefers-reduced-motion: reduce) { .key, .swatch { transition: none; } }
</style>
<style>html,body{margin:0}</style>
</head>
<body>


<canvas id="stage" aria-label="12음 나선 계단 3D 장면"></canvas>

<div class="top">
  <h1 class="sr-only">계이름 계단</h1>
  <div class="chord" id="chordCard" aria-live="polite">
    <svg id="chordWheel" viewBox="-50 -50 100 100" width="84" height="84" aria-hidden="true"></svg>
    <div class="chord-text">
      <div class="chord-row"><span class="chord-sym" id="chordSym">–</span><span class="chord-rn" id="chordRn"></span></div>
      <div class="chord-desc" id="chordDesc">화음이 울리면 이름이 나와요</div>
    </div>
  </div>
  <div class="readout" aria-live="polite">
    <div class="swatch" id="swatch"></div>
    <div>
      <div class="solfa" id="solfa">♪</div>
      <div class="meta" id="meta">계단을 눌러 보세요 · 드래그해서 돌려 보기</div>
      <div class="vkey" id="vkey" hidden></div>
    </div>
  </div>
</div>

<div class="credit-line" id="creditLine"></div>
<div class="bottom" id="bottom">
  <button class="fold" id="fold" type="button" aria-expanded="true" aria-controls="foldable">▾ 조작판 접기</button>
  <div class="foldable" id="foldable">
  <div class="keys" id="keys" aria-label="계이름별로 모든 옥타브 듣기"></div>
  <div class="controls options">
    <div class="opt-group">
      <button class="btn primary" id="playChrom" type="button">▲ 반음계 오르기</button>
      <button class="btn" id="playMajor" type="button">▲ 장음계 오르기</button>
    </div>
    <div class="opt-group">
    <button class="btn" id="tTrail" type="button" aria-pressed="true">궤적</button>
    <button class="btn" id="tLaser" type="button" aria-pressed="true">레이저</button>
    <button class="btn" id="tLabels" type="button" aria-pressed="true">계이름</button>
    <button class="btn" id="tFloor" type="button" aria-pressed="false" title="음악을 재생하는 동안에는 자동으로 숨겨요">바닥</button>
    <button class="btn" id="tChord" type="button" aria-pressed="true">화음 이름</button>
    <button class="btn" id="tSpin" type="button" aria-pressed="true" title="누를 때마다: 오르며 회전 → 내리며 회전 → 멈춤">▲ 오르며 회전</button>
    <button class="btn" id="tCam" type="button" aria-pressed="false">카메라워크</button>
    </div>
  </div>
  </div>
  <div class="controls songs" aria-label="곡 재생">
    <select id="songSel" aria-label="곡 고르기">
      <optgroup label="바흐">
        <option value="bach">평균율 1권 전주곡 C장조</option>
        <option value="bwv847">평균율 1권 전주곡과 푸가 C단조</option>
        <option value="air">G선상의 아리아</option>
        <option value="cello">무반주 첼로 모음곡 1번 프렐류드</option>
      </optgroup>
      <optgroup label="헨델">
        <option value="sarabande">사라방드</option>
      </optgroup>
      <optgroup label="멘델스존">
        <option value="wings">노래의 날개 위에</option>
      </optgroup>
      <optgroup label="차이콥스키">
        <option value="june">사계 중 6월 〈뱃노래〉</option>
      </optgroup>
      <optgroup label="사티">
        <option value="satie">짐노페디 1번</option>
      </optgroup>
    </select>
    <select id="instSel" aria-label="악기 고르기">
      <option value="auto">악기: 곡에 맞게</option>
      <option value="xylo">실로폰</option>
      <option value="piano">피아노</option>
      <option value="strings">현악기</option>
      <option value="organ">오르간</option>
    </select>
    <button class="btn primary" type="button" id="play">▶ 재생</button>
    <button class="btn" type="button" id="stop" disabled>■ 정지</button>
    <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="재생 위치">
    <label class="tempo" for="tempo">빠르기 <input id="tempo" type="range" min="50" max="150" step="5" value="100"> <output id="tempoOut">100%</output></label>
  </div>

  // ---------- sound ----------

    const len = Math.max(0.12, dur || 0.6);

    const peak = 0.11 * (vol ? vol / 0.24 : 1);

    g.gain.setValueAtTime(0.0001, t);

  function piano(f, when, dur, vol) {

  function buildBach() {

    const CH = [

      'C4 E4 A4 E5 A5','C4 D4 F#4 A4 D5','B3 D4 G4 D5 G5','B3 C4 E4 G4 C5',
      'A3 C4 E4 G4 C5','D3 A3 D4 F#4 C5','G3 B3 D4 G4 B4','G3 Bb3 E4 G4 C#5',

      'F2 F3 A3 C4 E4','F#2 C3 A3 C4 Eb4','Ab2 F3 B3 C4 D4','G2 F3 G3 B3 D4',

  // seek bar

  document.getElementById('play').addEventListener('click', () => startSong(document.getElementById('songSel').value));
  document.getElementById('stop').addEventListener('click', stopSong);
  tempoEl.addEventListener('input', () => {

  const chromatic = steps.map(s => s.i);

  const keys = document.getElementById('keys');

  function toggle(id, apply) {

  toggle('tLabels', on => steps.forEach(s => s.label && (s.label.visible = on)));
  const spinBtn = document.getElementById('tSpin');
  // three states, one button: 1 = rising, 2 = sinking, 0 = off
  const SPIN = [{ label: '회전 멈춤', speed: 0 }, { label: '▲ 오르며 회전', speed: -0.7 }, { label: '▼ 내리며 회전', speed: 0.7 }];
  let spinState = reduceMotion ? 0 : 1;

  // ---------- picking ----------
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  const meshes = steps.map(s => s.mesh);
  function pick(e) {
    const r = canvas.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(meshes, false)[0];
    return hit ? hit.object.userData.index : -1;
  }
  let down = null, hovered = -1;
  canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointerup', e => {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) {
      const i = pick(e); if (i >= 0) { timers.forEach(clearTimeout); if (song) { play(freqOf(i), 0, 0.7, 0.3, manualInst()); steps[i].glow = 1; hold(steps[i], 0.7); chordFeed(i, 1.5); } else toggleLatch(i); }
    }

  canvas.addEventListener('pointerleave', () => { hovered = -1; });

  // ---------- layout ----------
  // Keep the stair inside the free band between the top overlays and the bottom panel:
  // shift the projection so the scene centre sits in the middle of that band.
  const topBox = document.querySelector('.top'), bottomBox = document.getElementById('bottom');
  let band = { top: 0, bottom: 1, left: 0, right: 1 };
  const wideMQ = matchMedia('(min-aspect-ratio: 16/10) and (min-width: 1200px)');
  function freeBand() {
    const h = window.innerHeight, w = window.innerWidth;
    if (document.body.classList.contains('wide')) {
      const l = bottomBox.getBoundingClientRect().right + 12, r = topBox.getBoundingClientRect().left - 12;
      return { top: 12 / h, bottom: 1 - 12 / h, left: l / w, right: r / w };
    }
    let top = 0;
    topBox.querySelectorAll('.readout, .chord').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.width > 0 && r.left < window.innerWidth * 0.62 && r.right > window.innerWidth * 0.38) top = Math.max(top, r.bottom);
    });
    top = Math.max(top, 8);
    let bottom = h;
    bottomBox.querySelectorAll('.keys, .controls, .fold').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.height > 0) bottom = Math.min(bottom, r.top);
    });
    if (bottom - top < h * 0.35) bottom = Math.min(h, top + h * 0.35);
    return { top: top / h, bottom: bottom / h, left: 0, right: 1 };
  }
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    band = freeBand();
    const shiftY = (0.5 - (band.top + band.bottom) / 2) * h;   // >0 moves the scene up
    const shiftX = (0.5 - (band.left + band.right) / 2) * w;      // >0 moves the scene left: centre it between the side rails
    camera.setViewOffset(w, h, shiftX, shiftY, w, h);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  // Corner points of every bar, used to fit the whole stair into the free band of the screen.
  const fitPts = [];
  for (let i = 0; i < N; i++) {
    const a = i * STEP, L = lenOf(i), y0 = i * RISE, y1 = y0 + THICK + BEVEL;
    const ca = Math.cos(a), sa = Math.sin(a), hw = BAR_W / 2;
    [R0, R0 + L].forEach(r => [-hw, hw].forEach(w => [y0, y1].forEach(y =>
      fitPts.push(new THREE.Vector3(r * ca + w * sa, y, -r * sa + w * ca)))));
  }
  function fitDistance() {
    // smallest distance at which every bar corner lands inside the free band (with a small margin)
    const dir = camera.position.clone().sub(controls.target);
    if (dir.lengthSq() < 1e-6) dir.set(0.72, 0.42, 0.62);
    dir.normalize();
    const saved = camera.position.clone();
    const top = 1 - 2 * band.top - 0.04, bottom = 1 - 2 * band.bottom + 0.04;
    const xl = -1 + 2 * band.left + 0.04, xr = 1 - 2 * (1 - band.right) - 0.04;
    // the turning stair shows different sides, so test a few azimuths around the current one
    const turns = [0, Math.PI / 6, Math.PI / 3, Math.PI / 2].map(t => dir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), t));
    const fits = d => turns.every(v => {
      camera.position.copy(controls.target).addScaledVector(v, d);
      camera.lookAt(controls.target); camera.updateMatrixWorld();
      const q = new THREE.Vector3();
      return fitPts.every(p => { q.copy(p).project(camera); return q.x > xl && q.x < xr && q.y < top && q.y > bottom && q.z < 1; });
    });
    let lo = 4, hi = controls.maxDistance;
    if (!fits(hi)) { camera.position.copy(saved); camera.lookAt(controls.target); return hi; }
    for (let k = 0; k < 22; k++) { const mid = (lo + hi) / 2; if (fits(mid)) hi = mid; else lo = mid; }
    camera.position.copy(saved); camera.lookAt(controls.target); camera.updateMatrixWorld();
    return hi;
  }
  // fit distance, then slide the target up or down so the stair's on-screen shape is centred in the band
  function fitView() {
    const tanH = Math.tan(camera.fov * Math.PI / 360);
    for (let pass = 0; pass < 3; pass++) {
      const d = fitDistance();
      placeCamera(d); camera.updateMatrixWorld();
      let ymin = Infinity, ymax = -Infinity; const q = new THREE.Vector3();
      fitPts.forEach(p => { q.copy(p).project(camera); ymin = Math.min(ymin, q.y); ymax = Math.max(ymax, q.y); });
      const want = 1 - band.top - band.bottom;            // NDC centre of the free band
      const delta = want - (ymin + ymax) / 2;
      if (Math.abs(delta) < 0.01) break;
      const shift = delta * d * tanH;
      controls.target.y -= shift; camera.position.y -= shift;
    }
    placeCamera(fitDistance());
  }
  function placeCamera(d) {
    const dir = camera.position.clone().sub(controls.target);
    if (dir.lengthSq() < 1e-6) dir.set(0.72, 0.42, 0.62);
    dir.normalize().multiplyScalar(d);
    camera.position.copy(controls.target).add(dir);
    controls.update();
  }
  const foldBtn = document.getElementById('fold');
  foldBtn.addEventListener('click', () => {
    const folded = bottomBox.classList.toggle('folded');
    foldBtn.setAttribute('aria-expanded', String(!folded));
    foldBtn.textContent = folded ? '▴ 조작판 펼치기' : '▾ 조작판 접기';
    try { localStorage.setItem('stairs-folded', folded ? '1' : '0'); } catch (e) {}
    resize();
    fitView();
  });
  if (window.ResizeObserver) new ResizeObserver(resize).observe(bottomBox);
  function applyWide() {
    const on = wideMQ.matches;
    if (document.body.classList.contains('wide') === on) return false;
    document.body.classList.toggle('wide', on);
    resize();
    return true;
  }
  applyWide();
  (wideMQ.addEventListener ? wideMQ.addEventListener('change', () => { if (applyWide()) fitView(); })
                           : wideMQ.addListener(() => { if (applyWide()) fitView(); }));
  resize();
  camera.position.set(0.72, midY + 0.42, 0.62);
  fitView();
  let savedFold = null;
  try { savedFold = localStorage.getItem('stairs-folded'); } catch (e) {}
  if (savedFold === '1' || (savedFold === null && window.innerWidth < 640)) foldBtn.click();

  // ---------- opening shot: the stair seen from straight above (a sunflower of bars), then down to the usual view ----------
  const intro = (() => {
    if (reduceMotion) return null;
    const end = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    // a long lens from high above flattens the layers, so every octave's petals show around the one above
    const fov0 = 15, fov1 = camera.fov;
    const tanH = Math.tan(fov0 * Math.PI / 360);
    const frac = Math.max(0.35, Math.min(band.bottom - band.top, camera.aspect * (band.right - band.left)));
    const reach = (R0 + L0 + 0.4) / (tanH * frac * 0.95);          // the widest (lowest) bars fill the band
    const startR = reach - controls.target.y;
    return { t: 0, hold: 1.8, move: 3.8, end, fov0, fov1,
             start: new THREE.Spherical(startR, 0.0015, end.theta - 1.1), spin: controls.autoRotate };
  })();
  function applySpherical(sp) {
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sp));
    camera.lookAt(controls.target);
  }
  function setFov(f) { camera.fov = f; camera.updateProjectionMatrix(); }
  if (intro) {
    controls.autoRotate = false;
    setFov(intro.fov0);
    applySpherical(intro.start);
    // bloom: bars light up from the short top petals out to the long bottom ones
    for (let i = N - 1; i >= 0; i--) setTimeout(() => { steps[i].glow = 1; }, 250 + (N - 1 - i) * 26);
  }
  setSpin(spinState);
  const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  function endIntro() {
    if (!intro || intro.done) return;
    intro.done = true;
    setFov(intro.fov1);
    applySpherical(intro.end);
    controls.autoRotate = spinState !== 0;
    controls.update();
  }
  function updateIntro(dt) {
    if (!intro || intro.done) return;
    intro.t += dt;
    if (intro.t < intro.hold) {                 // hover above, turning slowly like a flower head
      const sp = intro.start.clone(); sp.theta += intro.t * 0.12;
      applySpherical(sp); return;
    }
    const k = Math.min(1, (intro.t - intro.hold) / intro.move), e = ease(k);
    const a = intro.start, b = intro.end;
    // dolly and zoom together: widen the lens as the camera comes down
    setFov(intro.fov0 + (intro.fov1 - intro.fov0) * e);
    const sp = new THREE.Spherical(a.radius + (b.radius - a.radius) * e, a.phi + (b.phi - a.phi) * e,
                                   a.theta + intro.hold * 0.12 + (b.theta - a.theta - intro.hold * 0.12) * e);
    applySpherical(sp);
    if (k >= 1) endIntro();
  }
  // any touch, wheel or key ends the opening shot right away
  ['pointerdown', 'wheel', 'keydown'].forEach(ev => window.addEventListener(ev, endIntro, { capture: true, passive: true }));

  // ---------- camerawork: frame the shapes the marbles are drawing right now ----------
  // The recent landing points are fitted with a plane (PCA); the camera looks along that
  // plane's normal so the figures appear open rather than edge-on, and backs off far
  // enough to hold all of them inside the free band of the screen.
  const recent = [];
  const nowS = () => performance.now() / 1000;
  function noteSeen(p) { recent.push({ p: p.clone(), t: nowS() }); if (recent.length > 96) recent.shift(); }
  let camWork = false, camPause = 0, camGoal = null, camTick = 0, idleSpin = 0;
  const camCur = { target: controls.target.clone(), dir: new THREE.Vector3(0.72, 0.42, 0.62).normalize(), dist: 25 };
  const camBtn = document.getElementById('tCam');
  function setCamWork(on) {
    camWork = on;
    camBtn.setAttribute('aria-pressed', String(on));
    if (on) {
      setSpin(0);
      camCur.target.copy(controls.target);
      camCur.dir.copy(camera.position).sub(controls.target);
      camCur.dist = camCur.dir.length(); camCur.dir.normalize();
      camGoal = null; camTick = 0; camPause = 0;
    }
  }
  camBtn.addEventListener('click', () => setCamWork(!camWork));
  controls.addEventListener('start', () => { if (camWork) camPause = 4; });

  function topEigen(m) {             // power iteration on a symmetric 3×3 matrix
    let v = new THREE.Vector3(0.6, 0.5, 0.62), lam = 0;
    for (let k = 0; k < 40; k++) {
      const x = m[0] * v.x + m[1] * v.y + m[2] * v.z;
      const y = m[3] * v.x + m[4] * v.y + m[5] * v.z;
      const z = m[6] * v.x + m[7] * v.y + m[8] * v.z;
      const w = new THREE.Vector3(x, y, z);
      lam = w.length(); if (lam < 1e-9) break;
      v = w.multiplyScalar(1 / lam);
    }
    return { v, lam };
  }
  function overviewGoal(dt) {
    idleSpin += dt * 0.12;
    const cur = new THREE.Vector3(camCur.dir.x, 0, camCur.dir.z).normalize();
    const a = Math.atan2(cur.z, cur.x) + dt * 0.12;
    const dir = new THREE.Vector3(Math.cos(a), 0.45, Math.sin(a)).normalize();
    return { target: new THREE.Vector3(0, midY, 0), dir, dist: fitDistance() };
  }
  function computeGoal(dt) {
    const now = nowS();
    let pts = recent.filter(r => now - r.t < 2.6);
    if (pts.length < 8) pts = recent.slice(-8).filter(r => now - r.t < 8);
    if (pts.length < 2) return overviewGoal(dt);
    let W = 0; const c = new THREE.Vector3();
    const ws = pts.map(r => 0.35 + 0.65 * Math.exp(-(now - r.t) / 1.4));
    pts.forEach((r, k) => { c.addScaledVector(r.p, ws[k]); W += ws[k]; });
    c.multiplyScalar(1 / W);
    const m = [0, 0, 0, 0, 0, 0, 0, 0, 0];
    let radius = 0, ss = 0;
    pts.forEach((r, k) => {
      const d = r.p.clone().sub(c), w = ws[k];
      ss += w * d.lengthSq();
      m[0] += w * d.x * d.x; m[1] += w * d.x * d.y; m[2] += w * d.x * d.z;
      m[4] += w * d.y * d.y; m[5] += w * d.y * d.z; m[8] += w * d.z * d.z;
      radius = Math.max(radius, d.length());
    });
    m[3] = m[1]; m[6] = m[2]; m[7] = m[5];
    for (let k = 0; k < 9; k++) m[k] /= W;
    const e1 = topEigen(m);
    const m2 = m.slice(), v1 = e1.v.toArray();
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) m2[i * 3 + j] -= e1.lam * v1[i] * v1[j];
    const e2 = topEigen(m2);
    const outward = new THREE.Vector3(c.x, 0, c.z);
    if (outward.length() < 0.4) outward.copy(camCur.dir).setY(0);
    outward.normalize();
    let n;
    if (e1.lam < 1e-4 || e2.lam < e1.lam * 0.02) {
      // a line or a single spot: look at it from outside the spiral, a little above
      n = outward.clone().multiplyScalar(Math.cos(0.45)).setY(Math.sin(0.45));
      if (e1.lam > 1e-4) {        // turn so the line runs across the screen
        n.addScaledVector(e1.v, -n.dot(e1.v)).normalize();
      }
    } else {
      n = e1.v.clone().cross(e2.v).normalize();
    }
    // pick the side of the plane that keeps the camera steady, outside, and above
    const score = d => d.dot(camCur.dir) * 1.0 + d.dot(outward) * 0.6 + d.y * 0.5;
    if (score(n.clone().negate()) > score(n)) n.negate();
    // keep the elevation between slightly below and steeply above
    const el = Math.asin(THREE.MathUtils.clamp(n.y, -1, 1));
    const elC = THREE.MathUtils.clamp(el, -0.12, 1.0);
    if (elC !== el) {
      const h = new THREE.Vector3(n.x, 0, n.z);
      if (h.lengthSq() < 1e-6) h.copy(outward);
      h.normalize().multiplyScalar(Math.cos(elC));
      n = h.setY(Math.sin(elC));
    }
    const frac = Math.max(0.35, band.bottom - band.top);
    const bandAspect = camera.aspect * (band.right - band.left);
    const tanH = Math.tan(camera.fov * Math.PI / 360);
    const rms = Math.sqrt(ss / W);
    const fitR = Math.max(Math.min(radius, rms * 2.1), 1.4) * 1.15 + 0.5;
    const dist = Math.max(fitR / (tanH * frac), fitR / (tanH * bandAspect), 7);
    return { target: c, dir: n.normalize(), dist: Math.min(dist, controls.maxDistance) };
  }
  function updateCamWork(dt) {
    if (!camWork) return;
    if (camPause > 0) {             // the viewer is steering; follow them, then take over again
      camPause -= dt;

      camCur.dist = camCur.dir.length(); camCur.dir.normalize();

    camTick -= dt;
    if (camTick <= 0 || !camGoal) { camGoal = computeGoal(Math.max(dt, 0.35)); camTick = 0.35; }
    const k = reduceMotion ? 1 : 1 - Math.exp(-dt / 0.9);

    camCur.dist += (camGoal.dist - camCur.dist) * k * 0.7;

  // ---------- chord names: match the recently sounding pitch classes against chord templates ----------
  const ROOTS_EN = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
  const ROOTS_KO = ['도', '도♯', '레', '미♭', '미', '파', '파♯', '솔', '라♭', '라', '시♭', '시'];
  const CHORDS = [
    { iv: [0, 4, 7], sym: '', ko: '장3화음' },
    { iv: [0, 3, 7], sym: 'm', ko: '단3화음' },
    { iv: [0, 3, 6], sym: 'dim', ko: '감3화음' },
    { iv: [0, 4, 8], sym: 'aug', ko: '증3화음' },
    { iv: [0, 5, 7], sym: 'sus4', ko: '서스4 화음' },
    { iv: [0, 4, 7, 10], sym: '7', ko: '딸림7화음' },
    { iv: [0, 4, 7, 11], sym: 'maj7', ko: '장7화음' },
    { iv: [0, 3, 7, 10], sym: 'm7', ko: '단7화음' },
    { iv: [0, 3, 6, 10], sym: 'm7♭5', ko: '반감7화음' },
    { iv: [0, 3, 6, 9], sym: 'dim7', ko: '감7화음' }
  ];
  // spell chord tones by letter (3rd = root letter + 2, 5th = + 4, 7th = + 6) so B major reads 시·레♯·파♯
  const LET_EN = ['C', 'D', 'E', 'F', 'G', 'A', 'B'], LET_KO = ['도', '레', '미', '파', '솔', '라', '시'];
  const LET_PC = [0, 2, 4, 5, 7, 9, 11];
  const DEG = { 0: 0, 3: 2, 4: 2, 5: 3, 6: 4, 7: 4, 8: 4, 9: 6, 10: 6, 11: 6 };
  const ACC = { '-2': '𝄫', '-1': '♭', '0': '', '1': '♯', '2': '𝄪' };
  function spell(r, iv) {
    const rootLet = LET_EN.indexOf(ROOTS_EN[r][0]);
    return iv.map(d => {
      const L = (rootLet + DEG[d]) % 7, pc = (r + d) % 12;
      let acc = ((pc - LET_PC[L]) % 12 + 12) % 12; if (acc > 6) acc -= 12;
      return { en: LET_EN[L] + ACC[acc], ko: LET_KO[L] + ACC[acc], pc };
    });
  }
  // ---------- harmonic function: Roman numeral of the chord in the piece's key ----------
  const KEY_KO = ['다', '올림다', '라', '내림마', '마', '바', '올림바', '사', '내림가', '가', '내림나', '나'];
  const RN = ['I', '♭II', 'II', '♭III', 'III', 'IV', '♯IV', 'V', '♭VI', 'VI', '♭VII', 'VII'];
  const RN_MIN = ['I', '♭II', 'II', 'III', '♯III', 'IV', '♯IV', 'V', 'VI', '♯VI', 'VII', 'VII'];
  const SCALE = [[0, 2, 4, 5, 7, 9, 11], [0, 2, 3, 5, 7, 8, 10, 11]];          // major; minor (natural + leading tone)
  const FUNC = [{ 0: '으뜸화음', 2: '위으뜸화음', 4: '가온화음', 5: '버금딸림화음', 7: '딸림화음', 9: '버금가온화음', 11: '이끎화음' },
                { 0: '으뜸화음', 2: '위으뜸화음', 3: '가온화음', 5: '버금딸림화음', 7: '딸림화음', 8: '버금가온화음', 10: '♭7도 화음', 11: '이끎화음' }];
  const ROLE = { 0: 'tonic', 5: 'sub', 2: 'sub', 7: 'dom', 11: 'dom' };
  const TARGET = [{ 2: 'ii', 4: 'iii', 5: 'IV', 7: 'V', 9: 'vi' }, { 3: 'III', 5: 'iv', 7: 'V', 8: 'VI', 10: 'VII' }];
  const LOWER = new Set(['m', 'dim', 'm7', 'm7♭5', 'dim7']);
  const QSYM = { dim: '°', aug: '+', 'm7♭5': 'ø', dim7: '°', sus4: 'sus4' };
  const FIG3 = ['', '⁶', '⁶₄'], FIG7 = ['⁷', '⁶₅', '⁴₃', '⁴₂'];
  function figure(ch) {
    const k = ch.C.iv.findIndex(d => (ch.r + d) % 12 === ch.bassPc);
    const inv = k < 0 ? 0 : k;
    return ch.C.iv.length === 4 ? (ch.C.sym === 'maj7' && inv === 0 ? 'M⁷' : FIG7[inv]) : FIG3[inv];
  }
  function roman(ch, key) {
    const [tonic, minor] = key, d = (ch.r - tonic + 12) % 12, scale = SCALE[minor];
    const diatonic = ch.tones.every(pc => scale.includes((pc - tonic + 12) % 12));
    if (!diatonic) {   // secondary dominant (V, V7 of a diatonic chord) and secondary leading-tone sevenths
      const tgtV = (d + 5) % 12, tgtL = (d + 1) % 12;
      if ((ch.C.sym === '' || ch.C.sym === '7') && TARGET[minor][tgtV])
        return { rn: 'V' + figure(ch) + '/' + TARGET[minor][tgtV], fn: TARGET[minor][tgtV] + '로 가는 딸림화음(부속딸림화음)', role: 'sec' };
      if ((ch.C.sym === 'dim7' || ch.C.sym === 'm7♭5') && TARGET[minor][tgtL])
        return { rn: 'vii' + QSYM[ch.C.sym] + figure(ch) + '/' + TARGET[minor][tgtL], fn: TARGET[minor][tgtL] + '로 가는 이끎화음(부속화음)', role: 'sec' };
    }
    let base = (minor ? RN_MIN : RN)[d];
    if (LOWER.has(ch.C.sym)) base = base.toLowerCase();
    const q = QSYM[ch.C.sym] || '';
    return { rn: base + (q === 'sus4' ? '' : q) + figure(ch) + (q === 'sus4' ? 'sus4' : ''),
             fn: FUNC[minor][d] || (diatonic ? '' : '빌려온 화음'), role: ROLE[d] || '' };
  }
  // key estimate for free play (Krumhansl-Kessler profiles over recently played notes)
  const KK = [[6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88],
              [6.33, 2.68, 3.52, 5.38, 2.60, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17]];
  function estimateKey(hist) {
    if (hist.reduce((a, b) => a + b, 0) < 3) return null;
    const mean = a => a.reduce((x, y) => x + y, 0) / 12;
    const mh = mean(hist); let best = null;
    for (let m = 0; m < 2; m++) for (let t = 0; t < 12; t++) {
      const prof = KK[m], mp = mean(prof); let num = 0, dh = 0, dp = 0;
      for (let k = 0; k < 12; k++) { const a = hist[(k + t) % 12] - mh, b = prof[k] - mp; num += a * b; dh += a * a; dp += b * b; }
      const r = num / Math.sqrt(dh * dp || 1);
      if (!best || r > best.r) best = { r, key: [t, m] };
    }
    return best && best.r > 0.5 ? best.key : null;
  }
  const keyName = key => KEY_KO[key[0]] + (key[1] ? '단조' : '장조');

  const chordNotes = [];          // { i, pc, t, end, w }
  const keyHist = new Array(12).fill(0);
  const latched = new Set();       // steps the viewer has tapped to build a chord
  let chordOn = true, chordTick = 0, shown = null, pending = null, pendingN = 0;
  function chordFeed(i, durSec, vel) {
    const t = nowA();
    for (let k = 0; k < 12; k++) keyHist[k] *= 0.97;
    keyHist[steps[i].pc] += Math.min(2, 0.4 + (durSec || 0.3));
    chordNotes.push({ i, pc: steps[i].pc, t, end: t + Math.max(0.12, durSec || 0.3),
      w: (vel ? 0.5 + vel / 254 : 1) * Math.min(1.6, 0.55 + (durSec || 0.3)) });
    if (chordNotes.length > 160) chordNotes.splice(0, chordNotes.length - 160);
  }
  function analyse() {
    const now = nowA(), w = new Array(12).fill(0);
    let lowI = Infinity, lowW = 0;
    for (let k = chordNotes.length - 1; k >= 0; k--) {
      const c = chordNotes[k];
      const f = now < c.end ? 1 : Math.exp(-(now - c.end) / 0.35);
      if (f < 0.04) { if (now - c.end > 4) chordNotes.splice(k, 1); continue; }
      const x = c.w * f;
      w[c.pc] += x;
      if (x > 0.25 && c.i < lowI) { lowI = c.i; lowW = x; }
    }
    for (const i of latched) {
      w[steps[i].pc] += 1.2;
      if (i < lowI) lowI = i;
    }
    const T = w.reduce((a, b) => a + b, 0), mx = Math.max(...w);
    const present = w.filter(x => x > mx * 0.12).length;
    if (T < 0.6 || present < 3) return null;
    const bassPc = lowI < Infinity ? steps[lowI].pc : -1;
    let best = null;
    for (let r = 0; r < 12; r++) for (const C of CHORDS) {
      let inn = 0, miss = 0;
      const tones = C.iv.map(d => (r + d) % 12);
      tones.forEach((pc, k) => {
        inn += w[pc];
        if (w[pc] < mx * 0.12) miss += C.iv[k] === 7 ? 0.08 : (k === 0 ? 0.35 : 0.22);
      });
      let sc = (inn - 0.75 * (T - inn)) / T - miss - (C.iv.length - 3) * 0.04;
      if (bassPc === r) sc += 0.1;
      if (!best || sc > best.sc) best = { sc, r, C, tones, bassPc };
    }
    return best && best.sc > 0.32 ? best : null;
  }
  const chordCard = document.getElementById('chordCard');
  const chordSym = document.getElementById('chordSym'), chordDesc = document.getElementById('chordDesc');
  const chordRn = document.getElementById('chordRn');
  function currentKey() {
    if (song && song.S.key) return song.S.key;
    return estimateKey(keyHist);
  }
  const wheel = document.getElementById('chordWheel');
  const SVGNS = 'http://www.w3.org/2000/svg';
  const wheelXY = (pc, r) => {          // same turning sense as the stair seen from above, C at the top
    const a = Math.PI / 2 + pc * STEP;
    return [r * Math.cos(a), -r * Math.sin(a)];
  };
  function drawWheel(ch) {
    let h = '<circle r="44" fill="none" stroke="rgba(220,228,255,.14)"/>';
    if (ch) {
      const pts = ch.tones.map(pc => wheelXY(pc, 36));
      const sorted = ch.tones.slice().sort((a, b) => a - b).map(pc => wheelXY(pc, 36));
      h += '<polygon points="' + sorted.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ') +
           '" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.35)" stroke-width="1"/>';
      ch.tones.forEach((pc, k) => {
        const [x, y] = pts[k];
        h += '<line x1="0" y1="0" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="' + COLORS[pc] +
             '" stroke-width="' + (k === 0 ? 4 : 2.6) + '" stroke-linecap="round"/>';
      });
    }
    for (let pc = 0; pc < 12; pc++) {
      const on = ch && ch.tones.includes(pc), [x, y] = wheelXY(pc, 40);
      h += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (on ? 5.2 : 2.6) + '" fill="' + COLORS[pc] +
           '" opacity="' + (on ? 1 : 0.55) + '"/>';
    }
    h += '<circle r="3" fill="rgba(238,240,248,.8)"/>';
    wheel.innerHTML = h;
  }
  // a diminished seventh is symmetric: pick the root that leads (a half step up) to a chord of the key
  function rerootDim7(ch, key) {
    if (!key || ch.C.sym !== 'dim7') return ch;
    const [tonic, minor] = key;
    for (const off of [0, 3, 6, 9]) {
      const r = (ch.r + off) % 12, d = (r - tonic + 12) % 12;
      if (d === 11 || TARGET[minor][(d + 1) % 12]) {
        return Object.assign({}, ch, { r, tones: ch.C.iv.map(x => (r + x) % 12) });
      }
    }
    return ch;
  }
  function showChord(ch) {
    if (ch) ch = rerootDim7(ch, currentKey());
    shown = ch;
    if (!ch) {
      chordSym.textContent = '–'; chordRn.textContent = '';
      chordDesc.textContent = song ? '화음을 듣는 중'
        : latched.size ? '음을 ' + (3 - latched.size) + '개 더 쌓아 보세요' : '계단을 눌러 음을 쌓아 보세요. 다시 누르면 빠져요';
      chordCard.classList.add('idle'); drawWheel(null); chordVisibility(); return;
    }
    const names = spell(ch.r, ch.C.iv);
    const bassName = names.find(x => x.pc === ch.bassPc);
    const slash = bassName && ch.bassPc !== ch.r ? '/' + bassName.en : '';
    chordSym.textContent = ROOTS_EN[ch.r] + ch.C.sym + slash;
    const key = currentKey();
    const tones = names.map(x => x.ko).join('·');
    if (key) {
      const R = roman(ch, key);
      chordRn.textContent = R.rn; chordRn.className = 'chord-rn ' + R.role;
      chordDesc.textContent = keyName(key) + (song ? '' : '(추정)') + (R.fn ? '의 ' + R.fn : '') + ' · ' + tones;
    } else {
      chordRn.textContent = ''; chordRn.className = 'chord-rn';
      chordDesc.textContent = ROOTS_KO[ch.r] + ' ' + ch.C.ko + ' · ' + tones;
    }
    chordCard.classList.remove('idle');
    chordVisibility();
    drawWheel(ch);
  }
  const sameChord = (a, b) => a && b && a.C === b.C && a.bassPc === b.bassPc &&
    (a.r === b.r || (a.C.sym === 'dim7' && (a.r - b.r + 12) % 3 === 0));
  function updateChord(dt) {
    if (!chordOn) return;
    chordTick -= dt; if (chordTick > 0) return;
    chordTick = 0.1;
    const ch = analyse();
    if (!ch) { if (shown && ++pendingN > 6) { showChord(null); pendingN = 0; } return; }
    if (sameChord(ch, shown)) { pending = null; pendingN = 0; shown.tones = ch.tones; return; }
    if (sameChord(ch, pending)) pendingN++; else { pending = ch; pendingN = 1; }
    if (pendingN >= 2) { showChord(ch); pending = null; pendingN = 0; }
  }
  document.getElementById('tChord').addEventListener('click', e => {
    chordOn = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', String(chordOn));
    chordVisibility();
    resize();
  });
  showChord(null);

  // ---------- sustain pedal: tapped steps keep sounding together until 5 s after the last tap ----------
  const PEDAL_SEC = 5;
  let pedalUntil = 0;
  const voices = new Map();          // step index -> sustained voice
  function sustainVoice(f, inst) {
    const a = audio(); if (!a) return null;
    const t = a.currentTime;
    const out = a.createGain(); out.connect(master);
    const env = out.gain, oscs = [];
    const add = (type, mult, amp, detune) => {
      if (f * mult > 11000) return null;
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.value = f * mult; if (detune) o.detune.value = detune;
      g.gain.value = amp; o.connect(g); oscs.push(o); return g;
    };
    const low = Math.min(1, Math.max(0, (330 - f) / 260));
    let peak, rest, attack, dest = out;
    if (inst === 'strings') {
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = Math.min(f * 6, 6000); lp.connect(out); dest = lp;
      [-7, 6].forEach(c => { const g = add('sawtooth', 1, 1, c); g && g.connect(lp); });
      peak = 0.07 * (f < 160 ? 1.35 : 1); rest = 0.85; attack = 0.12;
    } else if (inst === 'organ') {
      [[1, 1], [2, 0.5], [3, 0.22], [4, 0.18]].forEach(([m, amp]) => { const g = add('sine', m, amp); g && g.connect(out); });
      peak = 0.1; rest = 0.95; attack = 0.03;
    } else if (inst === 'piano') {
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = Math.max(Math.min(f * 5, 6000), 1200); lp.connect(out); dest = lp;
      [1, 0.55, 0.32, 0.2, 0.12, 0.07].forEach((amp, k) => { const g = add('sine', (k + 1) * Math.sqrt(1 + 0.00035 * (k + 1) * (k + 1)), amp); g && g.connect(lp); });
      peak = 0.13 * (f < 130 ? 1.45 : 1); rest = 0.32; attack = 0.005;
    } else {   // xylophone
      [[1, 1], [2, 0.55 * low], [3, 0.4 * low], [5, 0.18 * low]].forEach(([m, amp]) => { if (amp > 0.001) { const g = add('sine', m, amp); g && g.connect(out); } });
      const tick = add('sine', 4, 0.12); if (tick) { tick.gain.setValueAtTime(0.12, t); tick.gain.exponentialRampToValueAtTime(0.0001, t + 0.25); tick.connect(out); }
      peak = 0.22 * (1 + 0.5 * low); rest = 0.35; attack = 0.006;
    }
    env.setValueAtTime(0.0001, t);
    env.linearRampToValueAtTime(peak, t + attack);
    env.setTargetAtTime(peak * rest, t + attack, 1.6);      // settles to a steady level and keeps ringing
    oscs.forEach(o => o.start(t));
    return {
      release(fade) {
        const now = a.currentTime, len = fade || 0.8;
        env.cancelScheduledValues(now);
        env.setValueAtTime(Math.max(env.value, 0.0001), now);
        env.setTargetAtTime(0.0001, now, len / 4);
        oscs.forEach(o => o.stop(now + len + 0.2));
      }
    };
  }
  function releaseStep(i, fade) {
    const v = voices.get(i); if (v) v.release(fade); voices.delete(i);
    steps[i].holdUntil = nowA();
    latched.delete(i);
  }
  function latchUI() {
    chordTick = 0;
    if (latched.size < 3) showChord(null);
    chordVisibility();
  }
  function toggleLatch(i) {
    const s = steps[i];
    if (latched.has(i)) {
      releaseStep(i, 0.4);
    } else {
      latched.add(i);
      voices.set(i, sustainVoice(freqOf(i), manualInst()));
      light(i, null, 0.22, 0, PEDAL_SEC);
      s.holdUntil = Infinity;
      s.holdStart = nowA();
    }
    pedalUntil = nowA() + PEDAL_SEC;
    latchUI();
  }
  function clearLatch(fade) {
    [...latched].forEach(i => releaseStep(i, fade || 1.2));
    latchUI();
  }
  function updatePedal() {
    if (latched.size && nowA() > pedalUntil) clearLatch(1.4);
  }
  // the chord card shows during playback, or when the viewer has built a chord by hand
  function chordVisibility() {
    const on = chordOn && (!!song || (latched.size >= 3 && !!shown));
    chordCard.classList.toggle('gone', !on);
  }

  // ---------- loop ----------
  const clock = new THREE.Clock();

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    drainVisuals();
    updateSeek();
    updateIntro(dt);
    updateCamWork(dt);
    updateChord(dt);
    updatePedal();
    updateFloor(dt);
    const camD = camera.position.distanceTo(controls.target);   // fog follows zoom so far views stay bright
    scene.fog.near = camD * 0.85; scene.fog.far = camD * 2.4;
    updateTrails(dt);
    const tA = nowA();
    steps.forEach(s => {
      s.glow = Math.max(0, s.glow - dt * 1.6);
      const target = s.i === hovered ? 1 : 0;
      s.hover += (target - s.hover) * Math.min(1, dt * 12);
      const held = tA < s.holdUntil;
      const goal = held ? Math.min(1, 0.22 + Math.max(0, tA - s.holdStart) / NEON_RAMP) : 0;
      s.neonV = goal > s.neonV ? s.neonV + (goal - s.neonV) * Math.min(1, dt * 14) : Math.max(goal, s.neonV - dt * 1.1);
      const n = s.neonV;
      s.mat.emissiveIntensity = 0.08 + s.glow * 0.85 + s.hover * 0.22 + n * 0.25;
      if (n > 0.005) {
        s.neon.visible = true;
        const flick = 1 + Math.sin(tA * 31 + s.i * 1.7) * 0.03 * n;   // tiny gas-tube shimmer
        s.neon.children[0].material.opacity = Math.min(1, n * 1.1) * flick;
        s.neon.children[1].material.opacity = 0.32 * n * flick;
        s.neon.children[2].material.opacity = 0.13 * n * flick;
      } else if (s.neon.visible) s.neon.visible = false;
      // laser: shoots out fast on the attack, reaches further the longer the note is held
      const B = s.beam;
      if (laserOn && (n > 0.005 || s.beamLen > 0.05)) {
        const goalLen = held ? 5 + n * 26 : s.beamLen;
        s.beamLen += Math.sign(goalLen - s.beamLen) * Math.min(Math.abs(goalLen - s.beamLen), dt * 70);
        B.visible = n > 0.005;
        B.scale.x = Math.max(0.001, s.beamLen);
        B.children[0].material.opacity = Math.min(1, n * 1.3);
        B.children[1].material.opacity = 0.42 * n;
        B.children[2].material.opacity = 0.12 * n;
        if (n <= 0.005) s.beamLen = 0;
      } else if (B.visible) { B.visible = false; s.beamLen = 0; }
      s.mesh.position.y = s.baseY + s.glow * s.glow * 0.1;
    });
    threads.forEach(t => {
      t.userData.pulse = Math.max(0, t.userData.pulse - dt * 1.2);
      t.material.opacity = t.userData.base + t.userData.pulse * 0.55;
    });
    for (const M of marbles) {
      const hop = M.hop; if (!hop) continue;
      hop.t += dt / hop.dur;
      const k = Math.min(1, hop.t);
      M.m.position.lerpVectors(hop.from, hop.to, k);
      M.m.position.y += Math.sin(Math.PI * k) * 0.45;
      if (k >= 1) M.hop = null;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
